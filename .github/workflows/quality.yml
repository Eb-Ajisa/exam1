
name: JoshHack Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: JoshHack

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: JoshHack/pom.xml

      - name: Run JUnit regression tests
        run: bash ./mvnw test

      - name: Run PIT mutation testing
        run: bash ./mvnw test-compile org.pitest:pitest-maven:1.20.2:mutationCoverage

      - name: Run SpotBugs analysis
        run: bash ./mvnw compile spotbugs:spotbugs

      - name: Upload SpotBugs SARIF results
        if: success()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: JoshHack/target/spotbugsSarif.json

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: JoshHack/target/pit-reports/
